<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Screen Interior Design</title>

    <!-- Запрет кэширования для браузеров -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <!-- удаление хеш для js -->
    <script>
  var link = document.createElement('link');
  link.rel = 'stylesheet';
  // Переменная Date.now() добавляет текущее время в миллисекундах (например, ?v=1714567890123)
  link.href = 'css/main.css?v=' + Date.now(); 
  document.head.appendChild(link);
</script>
    <!-- ... остальные ваши теги (линки на шрифты и стили) ... -->
</head>

<body>

    <section class="hero">
        <!-- Контейнер для фонов (внутри него и цвет, и ЧБ) -->
        <div class="hero-bg-container">
            <canvas id="scratch-canvas"></canvas>
        </div>

        <!-- Контент без плашки с кнопками -->
        <div class="hero-content">
            <div class="brand-text">
                <span class="small-text">interior</span>
                <h1 class="main-title">design</h1>
            </div>

            <!-- Блок кнопок -->
            <div class="btn-group">
                <a href="#" class="btn btn-primary">Начать работу</a>
                <a href="#" class="btn btn-secondary">Подробнее</a>
            </div>
        </div>
    </section>

    <!-- Измените это перед закрывающим тегом body -->
    <script src="js/main.js?v=1.0.1"></script>
</body>

</html>
