<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Screen Interior Design</title>
    <!-- Подключаем изящный шрифт с засечками -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>

    <section class="hero">
        <!-- Контейнер для фонов (внутри него и цвет, и ЧБ) -->
        <div class="hero-bg-container">
            <canvas id="scratch-canvas"></canvas>
        </div>

        <!-- Контент без плашки с кнопками -->
        <div class="hero-content">
            <div class="brand-text">
                <span class="small-text">interior</span>
                <h1 class="main-title">design</h1>
            </div>

            <!-- Блок кнопок -->
            <div class="btn-group">
                <a href="#" class="btn btn-primary">Начать работу</a>
                <a href="#" class="btn btn-secondary">Подробнее</a>
            </div>
        </div>
    </section>

    <script src="js/main.js"></script>
</body>

</html>
